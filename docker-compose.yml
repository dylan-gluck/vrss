# VRSS Social Platform - Docker Compose (MVP)
# Simplified for fast local development

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: vrss_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vrss}
      POSTGRES_USER: ${DB_USER:-vrss_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vrss_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - vrss_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vrss_user} -d ${DB_NAME:-vrss}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Bun + Hono)
  backend:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: vrss_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3030}
      DATABASE_URL: postgresql://${DB_USER:-vrss_user}:${DB_PASSWORD:-vrss_dev_password}@db:5432/${DB_NAME:-vrss}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5050}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5050}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5050}
    volumes:
      # Mount entire workspace for development (read-write for hot reload)
      - .:/app
      # Persist node_modules in named volume (faster, avoids host sync issues)
      - backend_node_modules:/app/node_modules
      - backend_api_node_modules:/app/apps/api/node_modules
      - backend_packages_node_modules:/app/packages/api-contracts/node_modules
    ports:
      - "${BACKEND_PORT:-3030}:3030"
    networks:
      - vrss_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend PWA (Vite + React)
  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: vrss_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_PORT: 5050
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3030}
    volumes:
      # Mount entire workspace for development (read-write for Vite HMR)
      - .:/app
      # Persist node_modules in named volume
      - frontend_node_modules:/app/node_modules
      - frontend_web_node_modules:/app/apps/web/node_modules
    ports:
      - "5050:5050"
    networks:
      - vrss_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vrss_network:
    driver: bridge

volumes:
  postgres_data:
  backend_node_modules:
  backend_api_node_modules:
  backend_packages_node_modules:
  frontend_node_modules:
  frontend_web_node_modules:
